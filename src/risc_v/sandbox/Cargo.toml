[package]
name = "risc-v-sandbox"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "risc-v-sandbox"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.2"
crossterm = "0.27.0"
ratatui = "0.26.1"

[dependencies.clap]
version = "4.4.6"
features = ["derive"]

[dependencies.kernel-loader]
path = "../kernel_loader"

[dependencies.risc-v-interpreter]
path = "../interpreter"
